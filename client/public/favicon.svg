<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090a0f" />
      <stop offset="100%" stop-color="#141724" />
    </linearGradient>

    <!-- Vibrant Brand Accent Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="cyanGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Container with Glowing Cyan Border -->
  <rect width="64" height="64" rx="18" fill="url(#bgGrad)" stroke="url(#brandGrad)" stroke-width="2.5" stroke-opacity="0.8" />
  
  <!-- Interior Frame Accent -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="#22d3ee" stroke-width="1" stroke-opacity="0.2" />

  <!-- BrainCircuit Icon Centered and Scaled -->
  <g transform="translate(12, 12) scale(1.6667)" filter="url(#cyanGlow)" stroke="url(#brandGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z"/>
    <path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z"/>
    <path d="M15 13a4.5 4.5 0 0 1-3-4 4.5 4.5 0 0 1-3 4"/>
    <path d="M17.599 6.5a3 3 0 0 0 .399-1.375"/>
    <path d="M6.003 5.125A3 3 0 0 0 6.401 6.5"/>
    <path d="M3.477 10.895A4 4 0 0 1 5 10"/>
    <path d="M19 10a4 4 0 0 1 1.523.895"/>
    <path d="M4.032 17.486A4 4 0 0 0 6 18"/>
    <path d="M18 18a4 4 0 0 0 1.968-.514"/>
    <path d="M12 18v4"/>
    <path d="M12 2v3"/>
  </g>
</svg>
